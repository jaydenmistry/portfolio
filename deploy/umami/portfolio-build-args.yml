# Compose override used AFTER the existing apps/compose.yml; preserves other services.
# Run from ~/docker/stacks/apps so its .env provides CONFIG_ROOT and portfolio values.
services:
  portfolio:
    build:
      context: ${CONFIG_ROOT:?Set CONFIG_ROOT}/portfolio/.
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://jmistry.com}
        NEXT_PUBLIC_FORMSPREE_ID: ${NEXT_PUBLIC_FORMSPREE_ID:-xwvgkeda}
        NEXT_PUBLIC_UMAMI_SRC: ${NEXT_PUBLIC_UMAMI_SRC:-}
        NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${NEXT_PUBLIC_UMAMI_WEBSITE_ID:-}
