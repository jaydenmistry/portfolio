services:

  traefik:
    image: "traefik:v3.6"
    container_name: "traefik"
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN}
    security_opt:
      - no-new-privileges:true
    ports:
      - "${TRAEFIK_HTTP_PORT}:80"
      - "${TRAEFIK_HTTPS_PORT}:443"
    #   - "${TRAEFIK_DASH_PORT}:8080"
    command:
      # Providers
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=${TRAEFIK_NET}"
      # Entrypoints
      - "--entryPoints.web.address=:80"
      - "--entryPoints.websecure.address=:443"
      - "--entryPoints.web.http.redirections.entrypoint.to=websecure"
      - "--entryPoints.web.http.redirections.entrypoint.scheme=https"
      # ACME / Let's Encrypt (DNS-01 via Cloudflare)
      - "--certificatesresolvers.cf.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.cf.acme.storage=/acme/acme.json"
      - "--certificatesresolvers.cf.acme.dnschallenge=true"
      - "--certificatesresolvers.cf.acme.dnschallenge.provider=cloudflare"
      # helps avoid “weird DNS” issues on homelabs
      - "--certificatesresolvers.cf.acme.dnschallenge.resolvers=1.1.1.1:53,8.8.8.8:53"
      # Dashboard (secure way is to route it behind HTTPS; don’t publish 8080)
      - "--api.dashboard=true"
      # (insecure mode exposes :8080; not recommended)
      # - "--api.insecure=true"
      # - "--serversTransport.insecureSkipVerify=true"
      # Access Logs
      - "--accesslog=true"
      - "--accesslog.format=json"
      - "--accesslog.addinternals=true"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.rule=Host(`${TRAEFIK_HOST}`)"
      - "traefik.http.routers.traefik.entrypoints=websecure"	
      - "traefik.http.routers.traefik.tls=true"
      - "traefik.http.routers.traefik.tls.certresolver=cf"
      # - "traefik.http.services.traefik.loadbalancer.server.port=8080"
      - "traefik.http.routers.traefik.service=api@internal"
      - "traefik.docker.network=${TRAEFIK_NET}"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "${CONFIG_ROOT}/traefik/acme:/acme"
    networks:
      - traefik_net

  whoami:
    image: "traefik/whoami"
    restart: unless-stopped
    container_name: traefik-whoami
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.whoami.rule=Host(`${WHOAMI_HOST}`)"
      - "traefik.http.routers.whoami.entrypoints=websecure"
      - "traefik.http.routers.whoami.tls=true"
      - "traefik.http.routers.whoami.tls.certresolver=cf"
      - "traefik.docker.network=${TRAEFIK_NET}"
    networks:
      - traefik_net

networks:
  traefik_net:
    external: true
    name: ${TRAEFIK_NET}
