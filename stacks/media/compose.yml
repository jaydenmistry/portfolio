services:

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_ROOT}/radarr/config:/config
      - ${MEDIA_ROOT}:/media
    # ports:
    #   - ${RADARR_PORT}:7878
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.radarr.rule=Host(`${RADARR_HOST}`)"
      - "traefik.http.routers.radarr.entrypoints=websecure"
      - "traefik.http.routers.radarr.tls=true"
      - "traefik.http.routers.radarr.tls.certresolver=cf"
      - "traefik.http.services.radarr.loadbalancer.server.port=7878"
      - "traefik.docker.network=${TRAEFIK_NET}"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:7878/api/v3/system/status?apikey=${RADARR_API_KEY} || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - media_net
      - traefik_net

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_ROOT}/sonarr/config:/config
      - ${MEDIA_ROOT}:/media
    # ports:
    #   - ${SONARR_PORT}:8989
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:8989/api/v3/system/status?apikey=${SONARR_API_KEY} || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sonarr.rule=Host(`${SONARR_HOST}`)"
      - "traefik.http.routers.sonarr.entrypoints=websecure"
      - "traefik.http.routers.sonarr.tls=true"
      - "traefik.http.routers.sonarr.tls.certresolver=cf"
      - "traefik.http.services.sonarr.loadbalancer.server.port=8989"
      - "traefik.docker.network=${TRAEFIK_NET}"
    restart: unless-stopped
    networks:
      - media_net
      - traefik_net

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_ROOT}/prowlarr/config:/config
      - ${MEDIA_ROOT}:/media
    # ports:
    #   - ${PROWLARR_PORT}:9696
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prowlarr.rule=Host(`${PROWLARR_HOST}`)"
      - "traefik.http.routers.prowlarr.entrypoints=websecure"
      - "traefik.http.routers.prowlarr.tls=true"
      - "traefik.http.routers.prowlarr.tls.certresolver=cf"
      - "traefik.http.services.prowlarr.loadbalancer.server.port=9696"
      - "traefik.docker.network=${TRAEFIK_NET}"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:9696/api/v1/system/status?apikey=${PROWLARR_API_KEY} || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - media_net
      - traefik_net

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_ROOT}/bazarr/config:/config
      - ${MEDIA_ROOT}:/media
    # ports:
    #   - ${BAZARR_PORT}:6767
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:6767/api/system/status?apikey=${BAZARR_API_KEY}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.bazarr.rule=Host(`${BAZARR_HOST}`)"
      - "traefik.http.routers.bazarr.entrypoints=websecure"
      - "traefik.http.routers.bazarr.tls=true"
      - "traefik.http.routers.bazarr.tls.certresolver=cf"
      - "traefik.http.services.bazarr.loadbalancer.server.port=6767"
      - "traefik.docker.network=${TRAEFIK_NET}"
    restart: unless-stopped
    networks:
      - media_net
      - traefik_net

  whisp:
    container_name: whisp
    image: ghcr.io/hotio/whisparr
    # ports:
    #   - "${WHISP_PORT}:6969"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - UMASK=002
    volumes:
      - ${CONFIG_ROOT}/whisp/config:/config
      - ${MEDIA_ROOT}:/media
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:6969/api/v3/system/status?apikey=${WHISP_API_KEY} || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.whisp.rule=Host(`${WHISP_HOST}`)"
      - "traefik.http.routers.whisp.entrypoints=websecure"
      - "traefik.http.routers.whisp.tls=true"
      - "traefik.http.routers.whisp.tls.certresolver=cf"
      - "traefik.http.services.whisp.loadbalancer.server.port=6969"
      - "traefik.docker.network=${TRAEFIK_NET}"
    networks:
      - media_net
      - traefik_net

  huntarr:
    image: huntarr/huntarr:latest
    container_name: huntarr
    restart: always
    # ports:
    #   - "${HUNTARR_PORT}:9705"
    volumes:
      - ${CONFIG_ROOT}/huntarr/config:/config
    environment:
      - TZ=${TZ}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.huntarr.rule=Host(`${HUNTARR_HOST}`)"
      - "traefik.http.routers.huntarr.entrypoints=websecure"
      - "traefik.http.routers.huntarr.tls=true"
      - "traefik.http.routers.huntarr.tls.certresolver=cf"
      - "traefik.http.services.huntarr.loadbalancer.server.port=9705"
      - "traefik.docker.network=${TRAEFIK_NET}"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9705/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    networks:
      - media_net
      - traefik_net

  cleanuparr:
    image: ghcr.io/cleanuparr/cleanuparr:latest
    container_name: cleanuparr
    restart: unless-stopped
    # ports:
    #   - "${CLEANUPARR_PORT}:11011"
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      - PORT=${CLEANUPARR_PORT}
      - SONARR_API_KEY=${SONARR_API_KEY}
      - SONARR_URL=http://sonarr:${SONARR_PORT}
      - RADARR_API_KEY=${RADARR_API_KEY}
      - RADARR_URL=http://radarr:${RADARR_PORT}
      - WHISPARR_API_KEY=${WHISP_API_KEY}
      - WHISPARR_URL=http://whisp:${WHISP_PORT}
      - QBITTORRENT_URL=http://qbittorrent:${QBITTORRENT_WEBUI_PORT}
      - QBITTORRENT_USERNAME=${QB_USERNAME}
      - QBITTORRENT_PASSWORD=${QB_PASSWORD}
      # Optional integrations:
      - DELUGE_URL=http://deluge:${DELUGE_WEBUI_PORT}
      # - LIDARR_URL=http://lidarr:${LIDARR_PORT}
      # - READARR_URL=http://readarr.home:${READARR_PORT}
    volumes:
      - ${CONFIG_ROOT}/cleanuparr/config:/config
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.cleanuparr.rule=Host(`${CLEANUPARR_HOST}`)"
      - "traefik.http.routers.cleanuparr.entrypoints=websecure"
      - "traefik.http.routers.cleanuparr.tls=true"
      - "traefik.http.routers.cleanuparr.tls.certresolver=cf"
      - "traefik.http.services.cleanuparr.loadbalancer.server.port=11011"
      - "traefik.docker.network=${TRAEFIK_NET}"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:11011/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    networks:
      - media_net
      - traefik_net

  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    cap_add: [NET_ADMIN]
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - TZ=${TZ}
      - VPN_SERVICE_PROVIDER=custom
      - VPN_TYPE=openvpn
      - OPENVPN_CUSTOM_CONFIG=/gluetun/mullvad_us_atl.conf
      - OPENVPN_USER=${OPENVPN_USER}
      - OPENVPN_PASSWORD=${OPENVPN_PASSWORD}
    volumes:
      - ${CONFIG_ROOT}/qbittorrent/config:/gluetun
    ports:
      - ${QBITTORRENT_WEBUI_PORT}:${QBITTORRENT_WEBUI_PORT}
      - ${QBITTORRENT_TORRENTING_PORT}:${QBITTORRENT_TORRENTING_PORT}
      - ${QBITTORRENT_TORRENTING_PORT}:${QBITTORRENT_TORRENTING_PORT}/udp
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.qbittorrent.rule=Host(`${QBITTORRENT_HOST}`)"
      - "traefik.http.routers.qbittorrent.entrypoints=websecure"
      - "traefik.http.routers.qbittorrent.tls=true"
      - "traefik.http.routers.qbittorrent.tls.certresolver=cf"
      - "traefik.http.services.qbittorrent.loadbalancer.server.port=8090"
      - "traefik.docker.network=${TRAEFIK_NET}"
    restart: unless-stopped
    networks:
      - media_net
      - traefik_net

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: "service:gluetun"
    depends_on: [gluetun]
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - WEBUI_PORT=${QBITTORRENT_WEBUI_PORT}
      - TORRENTING_PORT=${QBITTORRENT_TORRENTING_PORT}
    volumes:
      - ${CONFIG_ROOT}/qbittorrent/config:/config
      - ${MEDIA_ROOT}:/media
      - ${CONFIG_ROOT}/qbittorrent/config/search-plugins:/plugins
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:8090/api/v2/app/version || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  deluge:
    image: lscr.io/linuxserver/deluge:latest
    container_name: deluge
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - DELUGE_LOGLEVEL=error #optional
    volumes:
      - ${CONFIG_ROOT}/deluge/config:/config
      - ${MEDIA_ROOT}:/media
    # ports:
    #   - ${DELUGE_WEBUI_PORT}:8112
    #   - ${DELUGE_TORRENTING_PORT}:6882
    #   - ${DELUGE_TORRENTING_PORT}:6882/udp
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.deluge.rule=Host(`${DELUGE_HOST}`)"
      - "traefik.http.routers.deluge.entrypoints=websecure"
      - "traefik.http.routers.deluge.tls=true"
      - "traefik.http.routers.deluge.tls.certresolver=cf"
      - "traefik.http.services.deluge.loadbalancer.server.port=8112"
      - "traefik.docker.network=${TRAEFIK_NET}"
    restart: unless-stopped
    networks:
      - media_net
      - traefik_net

  nzbget:
    image: lscr.io/linuxserver/nzbget:latest
    container_name: nzbget
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - HTTP_PROXY=socks5://${SOCKS5_IP}:${SOCKS5_PORT}
      - NO_PROXY=${LAN_IPV4},127.0.0.0/8
    volumes:
      - ${CONFIG_ROOT}/nzbget/config:/config
      - ${MEDIA_ROOT}:/media
    # ports:
    #   - ${NZBGET_PORT}:6789
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nzbget.rule=Host(`${NZBGET_HOST}`)"
      - "traefik.http.routers.nzbget.entrypoints=websecure"
      - "traefik.http.routers.nzbget.tls=true"
      - "traefik.http.routers.nzbget.tls.certresolver=cf"
      - "traefik.http.services.nzbget.loadbalancer.server.port=6789"
      - "traefik.docker.network=${TRAEFIK_NET}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:6789"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - media_net
      - traefik_net

  jellyseerr:
    image: fallenbagel/jellyseerr:latest
    container_name: jellyseerr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - LOG_LEVEL=debug
      - PORT=${JELLYSEERR_PORT}
    # ports:
    #   - ${JELLYSEERR_PORT}:5055
    volumes:
      - ${CONFIG_ROOT}/jellyseerr/config:/app/config
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://127.0.0.1:5055/api/v1/status || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jellyseerr.rule=Host(`${JELLYSEERR_HOST}`)"
      - "traefik.http.routers.jellyseerr.entrypoints=websecure"
      - "traefik.http.routers.jellyseerr.tls=true"
      - "traefik.http.routers.jellyseerr.tls.certresolver=cf"
      - "traefik.http.services.jellyseerr.loadbalancer.server.port=5055"
      - "traefik.docker.network=${TRAEFIK_NET}"
    restart: unless-stopped
    networks:
      - media_net
      - traefik_net

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_HTML=${LOG_HTML:-false}
      - CAPTCHA_SOLVER=${CAPTCHA_SOLVER:-none}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_ROOT}/flaresolverr/config:/config
    # ports:
    #   - "${FLARESOLVERR_PORT:-8191}:8191"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.flaresolverr.rule=Host(`${FLARESOLVERR_HOST}`)"
      - "traefik.http.routers.flaresolverr.entrypoints=websecure"
      - "traefik.http.routers.flaresolverr.tls=true"
      - "traefik.http.routers.flaresolverr.tls.certresolver=cf"
      - "traefik.http.services.flaresolverr.loadbalancer.server.port=8191"
      - "traefik.docker.network=${TRAEFIK_NET}"
    restart: unless-stopped
    networks:
      - media_net
      - traefik_net

networks:
  media_net:
    name: ${MEDIA_NET}
  traefik_net:
    external: true
    name: ${TRAEFIK_NET}
