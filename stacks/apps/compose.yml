services:

  homebridge:
    image: homebridge/homebridge:latest
    container_name: homebridge
    restart: always
    network_mode: host
    volumes:
      - ${CONFIG_ROOT}/homebridge:/homebridge
    logging:
      driver: json-file
      options:
        max-size: "100mb"
        max-file: "1"
    environment:
      - TZ=${TZ}
    healthcheck:
      test: curl --fail localhost:8581 || exit 1
      interval: 60s
      retries: 5
      start_period: 300s
      timeout: 2s

  db:
    image: mariadb:10.6
    restart: always
    container_name: nextcloud-db
    command: --transaction-isolation=READ-COMMITTED --log-bin=binlog --binlog-format=ROW
    volumes:
      - ${CONFIG_ROOT}/nextcloud/config/db:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
    networks:
      - apps_net
  app:
    image: nextcloud:31
    restart: always
    container_name: nextcloud
    # ports:
    #   - ${NEXTCLOUD_PORT}:80
    depends_on:
      - db
    volumes:
      - ${CONFIG_ROOT}/nextcloud/config/app:/var/www/html
    environment:
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
      - MYSQL_HOST=db
      - OVERWRITEPROTOCOL=https
      - TZ=${TZ}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nextcloud.rule=Host(`${NEXTCLOUD_HOST}`)"
      - "traefik.http.routers.nextcloud.entrypoints=websecure"
      - "traefik.http.routers.nextcloud.tls=true"
      - "traefik.http.routers.nextcloud.tls.certresolver=cf"
      - "traefik.http.services.nextcloud.loadbalancer.server.port=80"
      - "traefik.docker.network=${TRAEFIK_NET}"
    networks:
      - apps_net
      - traefik_net

  portfolio:
    build: ${CONFIG_ROOT}/portfolio/.
    container_name: portfolio
    restart: unless-stopped
    # ports:
    #   - "${PORTFOLIO_PORT}:3000"
    environment:
      - NODE_ENV=production
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.portfolio.rule=Host(`${PORTFOLIO_HOST}`)"
      - "traefik.http.routers.portfolio.entrypoints=websecure"
      - "traefik.http.routers.portfolio.tls=true"
      - "traefik.http.routers.portfolio.tls.certresolver=cf"
      - "traefik.http.services.portfolio.loadbalancer.server.port=3000"
      - "traefik.docker.network=${TRAEFIK_NET}"
    networks:
      - apps_net
      - traefik_net

networks:
  apps_net:
    name: ${APPS_NET}
  traefik_net:
    external: true
    name: ${TRAEFIK_NET}
