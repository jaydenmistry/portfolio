services:

  portainer:
    image: portainer/portainer-ee:alpine
    container_name: portainer
    # ports:
    #   - ${PORTAINER_PORT}:9443
    volumes:
      - ${CONFIG_ROOT}/portainer/config:/data
      - /var/run/docker.sock:/var/run/docker.sock
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.portainer.rule=Host(`${PORTAINER_HOST}`)"
      - "traefik.http.routers.portainer.entrypoints=websecure"
      - "traefik.http.routers.portainer.tls=true"
      - "traefik.http.routers.portainer.tls.certresolver=cf"
      - "traefik.http.services.portainer.loadbalancer.server.port=9000"
      - "traefik.docker.network=${TRAEFIK_NET}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9000/api/status"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - infra_net
      - traefik_net
  portainer-agent:
    image: portainer/agent:latest
    container_name: portainer-agent
    ports:
      - "${PORTAINER_AGENT_PORT}:9001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    restart: unless-stopped
    networks:
      - infra_net

  homarr:
    container_name: homarr
    image: ghcr.io/homarr-labs/homarr:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock # Optional, only if you want docker integration
      - ${CONFIG_ROOT}/homarr/config:/appdata
    # ports:
    #   - '${HOMARR_PORT}:7575'
    environment:
      - SECRET_ENCRYPTION_KEY=${HOMARR_KEY}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.homarr.rule=Host(`${HOMARR_HOST}`)"
      - "traefik.http.routers.homarr.entrypoints=websecure"
      - "traefik.http.routers.homarr.tls=true"
      - "traefik.http.routers.homarr.tls.certresolver=cf"
      - "traefik.http.services.homarr.loadbalancer.server.port=7575"
      - "traefik.docker.network=${TRAEFIK_NET}"
    networks:
      - infra_net
      - traefik_net

  pihole:
    container_name: pihole
    hostname: home.pihole
    image: pihole/pihole:latest
    environment:
      TZ: ${TZ}
      WEB_PORT: 80
      FTLCONF_LOCAL_DOMAIN: "lan"
      FTLCONF_LOCAL_IPV4: "${LAN_IPV4}"
      FTLCONF_dns_listeningMode: "all"
    ports:
      - "53:53/tcp"
      - "53:53/udp"
    #   - "${PIHOLE_WEBUI_PORT}:80/tcp"
    volumes:
      - ${CONFIG_ROOT}/pihole/etc-pihole:/etc/pihole
    cap_add:
      - NET_ADMIN
      - SYS_TIME
      - SYS_NICE
    depends_on:
      - unbound
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pihole.rule=Host(`${PIHOLE_HOST}`)"
      - "traefik.http.routers.pihole.entrypoints=websecure"
      - "traefik.http.routers.pihole.tls=true"
      - "traefik.http.routers.pihole.tls.certresolver=cf"
      - "traefik.http.services.pihole.loadbalancer.server.port=80"
      - "traefik.docker.network=${TRAEFIK_NET}"
    healthcheck:
      test: ["CMD", "pihole", "status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - infra_net
      - traefik_net
    restart: unless-stopped
    
  unbound:
    container_name: unbound
    image: mvance/unbound:latest
    restart: unless-stopped
    # ports:
    #   - "${UNBOUND_PORT}:53/tcp"
    #   - "${UNBOUND_PORT}:53/udp"
    healthcheck:
      test: ["CMD", "drill", "@127.0.0.1", "google.com"]
      interval: 60s
      timeout: 10s
      retries: 3
    networks:
      - infra_net

networks:
  infra_net:
    name: ${INFRA_NET}
  traefik_net:
    external: true
    name: ${TRAEFIK_NET}
