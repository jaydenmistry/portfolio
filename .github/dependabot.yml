# Weekly dependency PRs. CI runs on each one; merging to main deploys.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Blocked until eslint-plugin-react and jsx-a11y support ESLint 10
      # (docs/development.md).
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      # Tailwind 4 is a migration, not a version bump.
      - dependency-name: tailwindcss
        update-types: [version-update:semver-major]
      # Types follow the Node 22 runtime.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
