---
services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - WEBUI_PORT=${QBITTORRENT_WEBUI_PORT}
      - TORRENTING_PORT=${QBITTORRENT_TORRENTING_PORT}
    volumes:
      - ${CONFIG_ROOT}/qbittorrent/config:/config
      - ${MEDIA_ROOT}:/media
      - ${CONFIG_ROOT}/qbittorrent/config/search-plugins:/plugins
    ports:
      - ${QBITTORRENT_WEBUI_PORT}:8090
      - ${QBITTORRENT_TORRENTING_PORT}:6881
      - ${QBITTORRENT_TORRENTING_PORT}:6881/udp
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.qbittorrent.rule=Host(`${QBITTORRENT_HOST}`)"
      - "traefik.http.routers.qbittorrent.entrypoints=websecure"
      - "traefik.http.routers.qbittorrent.tls=true"
      - "traefik.http.routers.qbittorrent.tls.certresolver=cf"
      - "traefik.http.services.qbittorrent.loadbalancer.server.port=8090"
      - "traefik.docker.network=${TRAEFIK_NET}"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:8090/api/v2/app/version || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - default
      - traefik_net
      
networks:
  default:
    external: true
    name: ${MEDIA_NET}
  traefik_net:
    external: true
    name: ${TRAEFIK_NET}
